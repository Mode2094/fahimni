name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: CI only reads the repo. No production secrets are used —
# the Laravel suite runs against an in-memory SQLite database configured in
# phpunit.xml, and the frontend build uses placeholder public env vars.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate || true

      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage

  frontend:
    name: Next.js (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          # Public, non-secret placeholders — enough to compile the app.
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_PLATFORM_DOMAIN: app.example.com
        run: npm run build
