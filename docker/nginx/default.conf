# ─────────────────────────────────────────────────────────────────────────────
# LMS — production reverse proxy (single entry).
#
# Routing contract:
#   /            → frontend:3000 (Next.js — the whole UI: landing, teacher,
#                  admin, checkout). Browser hits ONE origin only.
#   /api/        → PHP-FPM (Laravel API)   — same-origin, no CORS in prod.
#   /storage/    → PHP-FPM (signed download URLs + public uploads; *.php denied)
#   /horizon     → PHP-FPM (queue dashboard, optional auth)
#   = /up, = /health → PHP-FPM (health checks)
#   ~ \.php$     → PHP-FPM (front controller via fixed SCRIPT_FILENAME; nginx
#                  container holds no app code — files resolve on the app side)
#
# TLS is OPTIONAL and safe-by-default: without certificates this server block
# serves plain HTTP only (still fine behind a public TLS terminator such as
# Cloudflare/Caddy). To serve TLS directly, copy docker/nginx/https.conf.example
# into docker/nginx/optional/ and drop fullchain.pem + privkey.pem into ./certs.
# ─────────────────────────────────────────────────────────────────────────────

# Optionally loaded TLS servers — empty dir = HTTP only (no boot failure).
include /etc/nginx/lms-optional.d/*.conf;

# Access log format that intentionally omits the query string: signed media
# URLs, file tickets and webhook secrets travel in query arguments and must
# never be persisted in logs. `$uri` is path-only; `$request` would include
# the full query string — never use it here.
log_format lms_safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    charset utf-8;
    server_tokens off;

    # ── Cloudflare real client IP (enable after moving behind Cloudflare) ──
    # Without this, $remote_addr is a Cloudflare edge IP and per-IP rate
    # limits / audit trails are wrong. Steps:
    #   1) Uncomment the directives below (keep them in sync with
    #      https://www.cloudflare.com/ips/ — ranges change occasionally).
    #   2) Keep real_ip_header CF-Connecting-IP.
    #   3) Firewall the origin so only Cloudflare IPs can reach ports 80/443.
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;
    # real_ip_recursive on;

    client_max_body_size 5G;
    client_body_timeout 3600s;
    client_header_timeout 3600s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/x-icon;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()" always;

    # ── health endpoints (must bypass the Next.js catch-all) ──────────────
    location = /up {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location = /health {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # ── BFF session endpoints (Next.js route handlers) ────────────────────
    # Matched BEFORE /api/ so session management never reaches PHP directly:
    # the BFF talks to Laravel server-to-server and the browser only ever
    # sees HttpOnly cookies.
    location /api/session/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Laravel API ───────────────────────────────────────────────────────
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Laravel-served storage (uploads + signed downloads). Never execute. ─
    location /storage/ {
        location ~ ^/storage/.*\.php$ { deny all; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Horizon dashboard (Laravel) ───────────────────────────────────────
    location = /horizon {
        return 301 /horizon/;
    }
    location /horizon/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Laravel front controller (anything non-static that reaches PHP) ───
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Real client IP for rate limiting & audit. We OVERWRITE (never
        # append) the incoming X-Forwarded-For: appending would let a client
        # smuggle a spoofed first hop past Laravel's trusted-proxy parsing.
        # Behind Cloudflare, enable the real_ip directives above so
        # $remote_addr already holds the true client address.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Next.js UI (everything else) ───────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; proxy_pass http://frontend:3000; }
    location = /robots.txt  { access_log off; proxy_pass http://frontend:3000; }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) — same spoofing rationale as the PHP block.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Dotfiles: deny everything except ACME challenges ──────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout lms_safe;
    error_log /dev/stderr;
}