# ─────────────────────────────────────────────────────────────────────────────
# Fahimni — Production / Staging Docker stack
#
# Isolation contract (two stacks may run on the same VPS):
#   • Run each stack from its own release directory with its own
#     COMPOSE_PROJECT_NAME and .env (see deploy/env/*.env.example).
#   • No fixed container_name: Compose prefixes every container with the
#     project name, so production and staging can never collide.
#   • Images are tagged with IMAGE_TAG (release SHA), never shared between
#     stacks. Volumes and the network are explicitly project-scoped.
#   • nginx publishes only on BIND_ADDR (default 127.0.0.1). The public
#     TLS terminator (Caddy) is the only process bound to 80/443.
#   • PostgreSQL and Redis publish no ports at all — private network only.
#
# Reproducibility / runtime contract:
#   • Third-party images are pinned to exact digests; app images are built
#     from this commit and tagged with IMAGE_TAG.
#   • Containers run the baked image — no host source-code bind-mounts.
#     Read-only nginx config/cert mounts are configuration, not application code.
#   • .env is a symlink to the stack's shared secrets file and is injected
#     at runtime (env_file). Nothing secret is baked into an image.
#   • Schema changes happen in `migrate` only, never destructively.
#
# TLS: terminate at Caddy (deploy/caddy/fahimni.caddy). nginx also supports
# direct TLS via docker/nginx/optional/https.conf if needed.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    # PostgreSQL 16.15 (alpine) — pinned to the digest tested locally.
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: "${DB_DATABASE:?DB_DATABASE must be set in .env — use a stack-specific database name}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME must be set in .env — use a stack-specific role}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env — refusing to start with a known default}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fahimni-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    # Redis 7.4.11 (alpine) — pinned to the digest tested locally.
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    security_opt:
      - no-new-privileges:true
    # AOF persistence: sessions survive redis restarts, caches survive reboots.
    # volatile-lru evicts ONLY TTL'd keys (sessions/cache) — never queue jobs,
    # which are persistent and must survive memory pressure.
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — refusing to start with a known default}"
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH keeps the password out of the healthcheck command line.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fahimni-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # schema + seed once, then exit 0. Never migrate:fresh.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: fahimni-app:${IMAGE_TAG:-latest}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    # Migrate always; seed ONLY on a fresh database so the super-admin
    # credentials are never re-applied on every deploy. plans:sync creates
    # the canonical plans when the plans table is empty (source of truth =
    # SubscriptionPlanSeeder, works in any environment, not just Docker).
    command: ["sh", "-c", "php artisan migrate --force && php artisan plans:sync && [ \"$(php artisan tinker --execute='echo \\App\\Models\\User::count();' 2>/dev/null || echo 0)\" = \"0\" ] && php artisan db:seed --force || true"]
    volumes:
      - storage_data:/var/www/html/storage
      - backups_data:/var/www/html/storage/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fahimni-net
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: fahimni-app:${IMAGE_TAG:-latest}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - storage_data:/var/www/html/storage
      - backups_data:/var/www/html/storage/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "9000"
    networks:
      - fahimni-net
    restart: unless-stopped
    stop_grace_period: 30s
    # Memory limit (safe cap; CPU deliberately unbounded — set after load tests).
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the browser bundle at build time — set
        # them once (and rebuild) when the public domain changes. The API URL
        # MUST stay same-origin ("/api/v1"): web auth is an HttpOnly session
        # cookie set by the BFF, so cross-origin ABSOLUTE URLs would drop the
        # cookie. nginx routes /api/ to PHP on the same origin.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-/api/v1}"
        NEXT_PUBLIC_PLATFORM_DOMAIN: "${NEXT_PUBLIC_PLATFORM_DOMAIN:-fahimni.me}"
    image: fahimni-frontend:${IMAGE_TAG:-latest}
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      # Server-side rewrite target for /api/v1 (same-origin API proxy).
      # Next.js (this container) forwards API calls through nginx → PHP-FPM.
      NEXT_REWRITE_API_TARGET: "http://nginx:80/api/v1"
    expose:
      - "3000"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fahimni-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    # nginx 1.27.5 (alpine) — pinned to the digest tested locally.
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional TLS server(s): drop a conf file here (see
      # docker/nginx/https.conf.example). Empty dir = plain HTTP only.
      - ./docker/nginx/optional:/etc/nginx/lms-optional.d:ro
      # TLS certificates — mount before enabling https.conf:
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    ports:
      # Loopback only: Caddy is the sole public listener on 80/443.
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:80"
      - "${BIND_ADDR:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    depends_on:
      - app
      - frontend
    networks:
      - fahimni-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    image: fahimni-scheduler:${IMAGE_TAG:-latest}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/html/storage
      - backups_data:/var/www/html/storage/app/backups
      # Certificates read-only for the SSL expiry check (never the private key).
      - ${MONITORING_CERTS_DIR:-./certs}:/etc/monitoring/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - fahimni-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: horizon
    image: fahimni-horizon:${IMAGE_TAG:-latest}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/html/storage
      # The backups disk must be the SAME volume in the worker that the app and
      # scheduler containers see — otherwise the API cannot find files created
      # by the queue worker.
      - backups_data:/var/www/html/storage/app/backups
      # Certificates read-only for the SSL expiry check (never the private key).
      - ${MONITORING_CERTS_DIR:-./certs}:/etc/monitoring/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - fahimni-net
    restart: unless-stopped
    stop_grace_period: 60s
    # Horizon already caps itself via config/horizon.php (10 workers × 128MB +
    # backup supervisor 512MB). The hard limit below guards the host from a
    # runaway worker leak, not a performance target.
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Load testing (k6) — started explicitly with:
  #    docker compose --profile loadtest run --rm loadtest <scenario-file.js>
  # Never run against production. See docs/CAPACITY_TESTING.md.
  loadtest:
    image: grafana/k6:1.0.0
    profiles: ["loadtest"]
    volumes:
      - ./tests/load:/tests
      - ./tests/load/results:/results
    environment:
      BASE_URL: ${K6_BASE_URL:-http://nginx:80}
      API_URL: ${K6_API_URL:-http://nginx:80/api/v1}
      PLATFORM_SLUG: ${K6_PLATFORM_SLUG:-demo}
      TEST_USER_EMAIL: ${K6_TEST_USER_EMAIL:-}
      TEST_USER_PASSWORD: ${K6_TEST_USER_PASSWORD:-}
      TEST_TENANT_ID: ${K6_TEST_TENANT_ID:-}
    networks:
      - fahimni-net
    entrypoint: ["sh", "-c"]
    command: ["k6 run /tests/scenarios/${K6_SCENARIO}.js --out json=/results/${K6_SCENARIO}.json"]

volumes:
  # Explicit stack-scoped names: production and staging never share data.
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-fahimni}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-fahimni}_redis_data
  storage_data:
    name: ${COMPOSE_PROJECT_NAME:-fahimni}_storage_data
  backups_data:
    name: ${COMPOSE_PROJECT_NAME:-fahimni}_backups_data

networks:
  fahimni-net:
    name: ${COMPOSE_PROJECT_NAME:-fahimni}_net
    driver: bridge